<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Attrition Risk Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            padding: 50px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: white;
            color: #5b4bc4;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .status {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 Employee Attrition Risk Analyzer</h1>

        <p>
            A Machine Learning based application for analyzing
            and estimating employee attrition risk.
        </p>

        <a href="#" class="btn">
            Launch AI Analyzer
        </a>

        <div class="status">
            GitHub Pages deployment successful ✅
        </div>

    </div>

</body>
</html>
