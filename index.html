<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Attrition Risk Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #4c63c7;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 Employee Attrition Risk Analyzer</h1>

        <p>
            Machine Learning based application for analyzing
            and estimating employee attrition risk.
        </p>

        <a
            href="http://localhost:8501"
            target="_blank"
            class="button">
            🚀 Open AI Analyzer
        </a>

        <div class="info">
            Run the Streamlit application in VS Code first,
            then click the button above.
        </div>

    </div>

</body>
</html>
